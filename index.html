<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infografía Interactiva</title>
  
  <!-- Estilos propios -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- 1. GSAP + ScrollTrigger -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

  <!-- 2. Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- 3. Interact.js -->
  <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>

  <!-- Script principal propio (defer para que cargue tras el HTML) -->
  <script src="js/main.js" defer></script>
</head>
<body>

  <header>
    <h1>Título de la Infografía</h1>
  </header>

  <main>
    <!-- Ejemplo para GSAP / ScrollTrigger -->
    <section class="seccion-animada">
      <div class="caja-animada">Animación de desplazamiento</div>
    </section>

    <!-- Ejemplo para Chart.js -->
    <section class="seccion-grafico">
      <canvas id="miGrafico"></canvas>
    </section>

    <!-- Ejemplo para Interact.js -->
    <section class="seccion-interactiva">
      <div id="elemento-arrastrable">Arrástrame</div>
    </section>
  </main>

</body>
</html>
